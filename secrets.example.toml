# Local computer: change mode to "local". OneDrive / Streamlit hosting: "onedrive".
[storage]
mode = "onedrive"

# Reuse your Microsoft app registration values, with a new redirect URI for this app.
[microsoft]
client_id = "YOUR_EXISTING_CLIENT_ID"
client_secret = "YOUR_EXISTING_CLIENT_SECRET"
tenant_id = "consumers"
authority = "consumers"
redirect_uri = "https://YOUR-INSTALLMENT-APP.streamlit.app/"
onedrive_folder = "Installment System"

# Optional password for LOCAL mode. Cloud mode uses Microsoft login instead.
# [app]
# access_password = "CHOOSE_A_PRIVATE_PASSWORD"
